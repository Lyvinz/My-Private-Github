trigger:
- none

variables:
- group: cif-maintenance-tool-shared

- name: cif-maintenance-tool.ref
  value: $[ resources.repositories['cif-maintenance-tool'].ref ]

- name: image-tag
  value: $[ replace(variables['cif-maintenance-tool.ref'], 'refs/tags/', '') ]

- name: is-tag
  value: $[ contains(variables['Build.SourceBranch'], 'tags') ]

- name: tag-filter
  value: $[ contains(variables['cif-maintenance-tool.ref'], 'refs/tags/') ]

resources:
  repositories:
  - repository: cif-maintenance-tool
    type: git
    name: cif-maintenance-tool
    trigger:
      branches:
        include:
        - main
      tags:
        include:
        - deploy-*.*.*

parameters:
- name: sharedPool
  type: string
  default: fatca-scm-linux

- name: environments
  type: object
  default:
    - name: DEV
      buildCommand: 'npm run builddev'
      artifactName: 'cmt/dev'
      environmentName: 'cmt-frontend-DEV'
      targetPath: '/home/cmt.dev/html'

stages:

- ${{ each env in parameters.environments }}:
  - stage: Build_${{ env.name }}
    displayName: Build ${{ env.name }}
    pool:
      name: ${{ parameters.sharedPool }}
    jobs:
    - job: Build
      displayName: Build
      steps:
      - checkout: cif-maintenance-tool

      - task: npmAuthenticate@0
        displayName: 'Authenticate npm'
        inputs:
          workingFile: '$(System.DefaultWorkingDirectory)/.npmrc'

      - task: CmdLine@2
        displayName: 'Install dependencies'
        inputs:
          script: |
            unset NODE_ENV && pnpm i

      - task: CmdLine@2
        displayName: 'Build app'
        inputs:
          script: |
            ${{ env.buildCommand }}

      - task: PublishBuildArtifacts@1
        displayName: 'Publish build artifact'
        inputs:
          PathToPublish: '$(System.DefaultWorkingDirectory)/dist'
          ArtifactName: '${{ env.artifactName }}'
          publishLocation: 'Container'

  - stage: Release_${{ env.name }}
    displayName: Release ${{ env.name }}
    dependsOn: Build_${{ env.name }}
    pool:
      name: ${{ parameters.sharedPool }}
    jobs:
    - deployment: Deploy_${{ env.name }}
      displayName: Deploy ${{ env.name }}
      environment: ${{ env.environmentName }}
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              displayName: 'Download artifact'
              artifact: ${{ env.artifactName }}

            - script: |
                echo "Deploying to server 1"
                chmod -R 644 $(Pipeline.Workspace)/${{ env.artifactName }}/*
                chmod 755 $(Pipeline.Workspace)/${{ env.artifactName }}/assets
                chmod -R 644 $(Pipeline.Workspace)/${{ env.artifactName }}/assets/*
                scp -rp $(Pipeline.Workspace)/${{ env.artifactName }}/* app_scmcmt@zcae013006.int100.cibcfcib.com:${{ env.targetPath }}
              displayName: 'Copy to zcae013006'
              continueOnError: true

            - script: |
                echo "Deploying to server 2"
                chmod -R 644 $(Pipeline.Workspace)/${{ env.artifactName }}/*
                chmod 755 $(Pipeline.Workspace)/${{ env.artifactName }}/assets
                chmod -R 644 $(Pipeline.Workspace)/${{ env.artifactName }}/assets/*
                scp -rp $(Pipeline.Workspace)/${{ env.artifactName }}/* app_scmcmt@zcae013007.int100.cibcfcib.com:${{ env.targetPath }}
              displayName: 'Copy to zcae013007'
              continueOnError: true