trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pom.xml

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  - template: templates/vars/dependency-bom-vars.yml

steps:
  - template: templates/steps/maven-bom-steps.yml



variables:
bomProjectName: 'dependency-bom'
mavenPomFile: 'pom.xml'
artifactFeed: 'fcibdev'
jdkVersion: '1.17'
validateGoal: 'validate'
deployGoal: 'deploy'





steps:
  - task: MavenAuthenticate@0
    displayName: 'Authenticate with Azure Artifacts'
    inputs:
      artifactsFeeds: '$(artifactFeed)'

  - task: Maven@3
    displayName: 'Validate BOM'
    inputs:
      mavenPomFile: '$(mavenPomFile)'
      goals: '$(validateGoal)'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '$(jdkVersion)'

  - task: Maven@3
    displayName: 'Deploy BOM'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      mavenPomFile: '$(mavenPomFile)'
      goals: '$(deployGoal)'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '$(jdkVersion)'
      publishJUnitResults: false