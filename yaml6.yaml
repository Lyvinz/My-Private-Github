trigger: none
pr: none

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    values:
      - DIT
    default: DIT

  - name: startDateTime
    displayName: 'Start Date Time (YYYY-mm-dd-HH.MM.SS)'
    type: string
    default: ''

  - name: endDateTime
    displayName: 'End Date Time (YYYY-mm-dd-HH.MM.SS)'
    type: string
    default: ''

  - name: xref
    displayName: 'X-Ref'
    type: string
    default: ''

  - name: stage
    displayName: 'Stage for mqfind -a'
    type: string
    default: ''

stages:
  - template: templates/search-transactions-stage.yml
    parameters:
      environment: ${{ parameters.environment }}
      startDateTime: ${{ parameters.startDateTime }}
      endDateTime: ${{ parameters.endDateTime }}
      xref: ${{ parameters.xref }}
      stage: ${{ parameters.stage }}




parameters:
  - name: environment
    type: string
    default: DIT
    values:
      - DIT

  - name: startDateTime
    type: string
    default: ''

  - name: endDateTime
    type: string
    default: ''

  - name: xref
    type: string
    default: ''

  - name: stage
    type: string
    default: ''

variables:
  - group: mqsc_${{ lower(parameters.environment) }}

  - name: mq_run_user
    value: 'mqm'

  - name: ssh_service_connection
    value: 'MQ ${{ parameters.environment }} (SSH)'

  - name: remote_output_dir
    value: '/tmp/search-transactions'

  - name: remote_output_file
    value: '/tmp/search-transactions/transactions_${{ parameters.xref }}.xml'

stages:
  - stage: SearchTransactions_${{ parameters.environment }}
    displayName: '${{ parameters.environment }} Search Transactions'

    jobs:
      - job: SearchTransactions_${{ parameters.environment }}
        displayName: '${{ parameters.environment }} Search Transactions'
        pool:
          name: 'ice-jdk8'

        steps:
          - checkout: none

          - task: Bash@3
            displayName: 'Validate inputs'
            inputs:
              targetType: 'inline'
              script: |
                set -e

                START="${{ parameters.startDateTime }}"
                END="${{ parameters.endDateTime }}"
                XREF="${{ parameters.xref }}"
                STAGE="${{ parameters.stage }}"

                if [ -z "$START" ]; then
                  echo "ERROR: startDateTime is required"
                  exit 1
                fi

                if [ -z "$END" ]; then
                  echo "ERROR: endDateTime is required"
                  exit 1
                fi

                if [ -z "$XREF" ]; then
                  echo "ERROR: xref is required"
                  exit 1
                fi

                if [ -z "$STAGE" ]; then
                  echo "ERROR: stage is required for mqfind -a"
                  exit 1
                fi

                if ! echo "$START" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
                  echo "ERROR: startDateTime must be in format YYYY-mm-dd-HH.MM.SS"
                  exit 1
                fi

                if ! echo "$END" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
                  echo "ERROR: endDateTime must be in format YYYY-mm-dd-HH.MM.SS"
                  exit 1
                fi

                echo "Validation passed."

          - task: SSH@0
            displayName: 'Run mqfind search'
            inputs:
              sshEndpoint: $(ssh_service_connection)
              runOptions: 'inline'
              inline: |
                set -e

                sudo mkdir -p "$(remote_output_dir)"
                sudo chown $(mq_run_user):$(mq_run_user) "$(remote_output_dir)"

                sudo su - $(mq_run_user) -c '
                  echo "Running on host:"
                  hostname

                  echo "Running as:"
                  whoami

                  echo "PATH:"
                  echo $PATH

                  command -v mqfind || exit 1

                  mqfind -a "${{ parameters.stage }}" \
                    "${{ parameters.startDateTime }}" \
                    "${{ parameters.endDateTime }}" \
                    "${{ parameters.xref }}" \
                    > "$(remote_output_file)"
                '

                if [ ! -s "$(remote_output_file)" ]; then
                  echo "<result>No transactions found</result>" | sudo tee "$(remote_output_file)" > /dev/null
                fi

                sudo chown $(mq_run_user):$(mq_run_user) "$(remote_output_file)"

          - task: SSH@0
            displayName: 'Print transaction output'
            inputs:
              sshEndpoint: $(ssh_service_connection)
              runOptions: 'inline'
              inline: |
                set -e
                sudo cat "$(remote_output_file)"

          - task: SSH@0
            displayName: 'Cleanup remote file'
            condition: always()
            inputs:
              sshEndpoint: $(ssh_service_connection)
              runOptions: 'inline'
              inline: |
                set -e
                sudo rm -f "$(remote_output_file)"     